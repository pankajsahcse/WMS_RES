	<style>
		.switch {
			position: relative;
			display: inline-block;
			width: 90px;
			height: 34px;
		}

		.switch input {
			display: none;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ca2222;
			-webkit-transition: .4s;
			transition: .4s;
		}

		.slider:before {
			position: absolute;
			content: "";
			height: 26px;
			width: 26px;
			left: 4px;
			bottom: 4px;
			background-color: white;
			-webkit-transition: .4s;
			transition: .4s;
		}

		input:checked+.slider {
			background-color: #2ab934;
		}

		input:focus+.slider {
			box-shadow: 0 0 1px #2196F3;
		}

		input:checked+.slider:before {
			-webkit-transform: translateX(55px);
			-ms-transform: translateX(55px);
			transform: translateX(55px);
		}

		/*------ ADDED CSS ---------*/
		.on {
			display: none;
		}

		.on,
		.off {
			color: white;
			position: absolute;
			transform: translate(-50%, -50%);
			top: 50%;
			left: 50%;
			font-size: 10px;
			font-family: Verdana, sans-serif;
		}

		input:checked+.slider .on {
			display: block;
		}

		input:checked+.slider .off {
			display: none;
		}

		/*--------- END --------*/

		/* Rounded sliders */
		.slider.round {
			border-radius: 4px;
		}

		.slider.round:before {
			border-radius: 10%;
		}
	</style>
</head>

					</h5>

						<span>&times;</span>
					</button>
				</div>
				<form name="issueEMBNumber" data-ng-submit="IssueEMBNumber(issueEMBNumber.$valid)"
					novalidate="novalidate">
					<!-- Body -->
					<div class="modal-body" style="padding: 30px 35px; background-color: #f8f9fa;">

						<div class="card" style="border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px;">
							<div class="card-body" style="padding: 30px;">

								<!-- Row 1 -->
								<div class="row" style="margin-bottom: 25px;">

									<div class="col-md-6">
										<div class="form-group">
											<label style="font-weight: 600; font-size: 14px; color: #495057; margin-bottom: 8px;">
												Allocated Sub Engineer Office Name <span class="text-danger">*</span>
											</label>
											<input type="text" class="form-control"
												data-ng-model="emb.subEngineerOffice" data-ng-disabled="true"
												style="height: 45px; font-size: 14px; border-radius: 6px; background-color: #e9ecef;" />
										</div>
									</div>

									<div class="col-md-6">
										<div class="form-group">
											<label style="font-weight: 600; font-size: 14px; color: #495057; margin-bottom: 8px;">
												Work Name <span class="text-danger">*</span>
											</label>
											<input type="text" class="form-control" data-ng-model="emb.workName"
												data-ng-disabled="true" style="height: 45px; font-size: 14px; border-radius: 6px; background-color: #e9ecef;" />
										</div>
									</div>

								</div>

								<!-- Row 2 -->
								<div class="row" style="margin-bottom: 25px;">

									<div class="col-md-12">
										<div class="form-group">
											<label style="font-weight: 600; font-size: 14px; color: #495057; margin-bottom: 8px;">
												Allocated Sub Engineer <span class="text-danger">*</span>
											</label>
											<select name="allocatedUserId" data-ng-required="true" class="form-control"
												data-ng-model="emb.allocatedUserId"
												style="height: 45px; font-size: 14px; border-radius: 6px; border: 1px solid #ced4da;">
												<option value="">-- Select Sub Engineer --</option>
												<option data-ng-repeat="i in EngineerList" value="{{i.id}}">
													{{i.username}}
												</option>
											</select>

											<div class="text-danger" style="font-size: 13px; margin-top: 5px;" data-ng-if="issueEMBNumber.$submitted &amp;&amp;
			                 issueEMBNumber.allocatedUserId.$error.required">
												<i class="fa fa-exclamation-circle"></i> Please select Sub Engineer
											</div>

										</div>
									</div>

								</div>

								<!-- Row 3 -->
								<div class="row">

									<div class="col-md-12">
										<div class="form-group">
											<label style="font-weight: 600; font-size: 14px; color: #495057; margin-bottom: 8px;">

							<i class="fa fa-times"></i> Close
						</button>

				</form>
			</div>
