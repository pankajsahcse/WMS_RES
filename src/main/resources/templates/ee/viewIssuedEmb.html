<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<script th:src="@{/js/language.js}"></script>
	<style>
		.switch {
			position: relative;
			display: inline-block;
			width: 90px;
			height: 34px;
		}

		.switch input {
			display: none;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ca2222;
			-webkit-transition: .4s;
			transition: .4s;
		}

		.slider:before {
			position: absolute;
			content: "";
			height: 26px;
			width: 26px;
			left: 4px;
			bottom: 4px;
			background-color: white;
			-webkit-transition: .4s;
			transition: .4s;
		}

		input:checked+.slider {
			background-color: #2ab934;
		}

		.preview-actions {
			font-size: 13px;
		}

		.row-action {
			margin-bottom: 6px;
			white-space: nowrap;
		}

		.row-action i {
			color: #000;
			margin-right: 4px;
		}

		.row-action a {
			color: #337ab7;
			font-weight: 600;
			text-decoration: none;
			margin-right: 12px;
		}

		.row-action a:hover {
			text-decoration: underline;
		}

		input:focus+.slider {
			box-shadow: 0 0 1px #2196F3;
		}

		input:checked+.slider:before {
			-webkit-transform: translateX(55px);
			-ms-transform: translateX(55px);
			transform: translateX(55px);
		}

		/*------ ADDED CSS ---------*/
		.on {
			display: none;
		}

		.on,
		.off {
			color: white;
			position: absolute;
			transform: translate(-50%, -50%);
			top: 50%;
			left: 50%;
			font-size: 10px;
			font-family: Verdana, sans-serif;
		}

		input:checked+.slider .on {
			display: block;
		}

		input:checked+.slider .off {
			display: none;
		}

		/*--------- END --------*/

		/* Rounded sliders */
		.slider.round {
			border-radius: 4px;
		}

		.slider.round:before {
			border-radius: 10%;
		}
	</style>
</head>

	<!-- Issue e-MB Modal -->
	<div class="modal fade" id="embModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-md" role="document">
			<div class="modal-content">

				<!-- Header -->
				<div class="modal-header bg-warning text-dark">
					<h5 class="modal-title">
						<i class="fa fa-file-text-o"></i>
						Issue e-MB Number
					</h5>
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span>
					</button>
				</div>
				<form name="issueEMBNumber" data-ng-submit="IssueEMBNumber(issueEMBNumber.$valid)"
					novalidate="novalidate">
					<!-- Body -->
					<div class="modal-body" style="padding: 25px 30px;">

						<div class="card shadow-sm border-0" style="width: 100%;">
							<div class="card-body" style="padding: 28px;">

								<!-- Row 1 -->
								<div class="row" style="margin-bottom: 18px;">

									<div class="col-md-4">
										<div class="form-group">
											<label class="fw-semibold" style="font-size: 13px;">
												Allocated Sub Engineer Office Name <span class="text-danger">*</span>
											</label>
											<input type="text" class="form-control"
												data-ng-model="emb.subEngineerOffice" data-ng-disabled="true"
												style="height: 40px; font-size: 14px;" />
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label class="fw-semibold" style="font-size: 13px;">
												Work Name <span class="text-danger">*</span>
											</label>
											<input type="text" class="form-control" data-ng-model="emb.workName"
												data-ng-disabled="true" style="height: 40px; font-size: 14px;" />
										</div>
									</div>

									<div class="col-md-4">
										<div class="form-group">
											<label class="fw-semibold" style="font-size: 13px;">
												Allocated Sub Engineer <span class="text-danger">*</span>
											</label>
											<select name="allocatedUserId" data-ng-required="true" class="form-control"
												data-ng-model="emb.allocatedUserId"
												style="height: 40px; font-size: 14px;">
												<option value="">-- Select Sub Engineer --</option>
												<option data-ng-repeat="i in EngineerList" value="{{i.id}}">
													{{i.username}}
												</option>
											</select>

											<div class="text-danger" data-ng-if="issueEMBNumber.$submitted &amp;&amp;
			                 issueEMBNumber.allocatedUserId.$error.required">
												Please select Sub Engineer
											</div>

										</div>
									</div>

								</div>

								<!-- Row 2 -->
								<div class="row">

									<div class="col-md-12">
										<div class="form-group">
											<label class="fw-semibold" style="font-size: 13px;">
												Remarks <span class="text-danger">*</span>
											</label>
											<textarea class="form-control" rows="4" name="remarks"
												data-ng-model="emb.remarks" data-ng-required="true"
												placeholder="Enter remarks here..."
												style="font-size: 14px; resize: vertical;"></textarea>
											<div class="text-danger" data-ng-if="issueEMBNumber.$submitted 
			                  &amp;&amp;
			                  issueEMBNumber.remarks.$error.required">
												Please enter remarks
											</div>
										</div>
									</div>

								</div>

							</div>
						</div>

					</div>



					<!-- Footer -->
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary" id="saveEmbBtn">
							<i class="fa fa-save"></i> Issue E-MB
						</button>
						<button type="button" class="btn btn-secondary" data-dismiss="modal">
							Close
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
